<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E0E0E" />
    <meta
      name="description"
      content="Maison Essence — perfumes e velas aromaticas selecionados."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- As duas familias do design system. `preconnect` antes do stylesheet
         porque a fonte vem de outro dominio: sem ele, o navegador so abre a
         conexao depois de ler o <link>, e o titulo pisca na fonte do sistema. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Jost:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>Maison Essence</title>

    <!--
      O tema, antes da primeira pintura.

      Sem isto a pagina abre no claro e vira escura quando o React monta: um
      clarao na cara de quem escolheu tema escuro, justamente no ambiente em
      que essa pessoa esta — quarto apagado, tela no maximo.

      Precisa ser embutido e sincrono. Um `<script src>` seria baixado, e a
      pintura aconteceria antes; um `defer` ou `type=module` roda depois do
      HTML, que e tarde demais. Sao as unicas linhas de JavaScript solto da
      aplicacao, e e por um motivo que nao tem contorno.

      Repete a logica de `features/theme/theme.ts` — a chave, os nomes dos
      modos e a regra de perguntar ao aparelho so quando ninguem escolheu.
      Nao da para importar o modulo aqui sem reintroduzir a espera que este
      script existe para evitar. O teste `theme.spec.ts` le este arquivo e
      compara com as constantes de la, para que as duas copias nao se
      separem.
    -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('maison.theme');

          if (mode !== 'light' && mode !== 'dark') {
            mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }

          document.documentElement.setAttribute('data-theme', mode);

          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', mode === 'dark' ? '#16130e' : '#0e0e0e');
        } catch (error) {
          /* Armazenamento bloqueado: fica o tema do sistema, pela @media. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
