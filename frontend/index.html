<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E0E0E" />
    <meta
      name="description"
      content="Maison Essence — perfumes e velas aromaticas selecionados."
    />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=2" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />

    <title>Maison Essence</title>

    <!--
      O tema, antes da primeira pintura.

      A loja esta travada no claro desde 29/10/2026 — `THEME_CHOICE_VISIBLE`
      em `features/theme/theme.ts` conta a decisao inteira. Este script e a
      copia dela que roda antes de o React existir, e por isso ele nao le a
      constante: so repete o resultado.

      Ele continua precisando existir, e por tres motivos. O bloco
      `@media (prefers-color-scheme: dark)` de `tokens.css` so e desarmado
      pelo atributo `data-theme="light"`, e sem este script o celular no modo
      noturno pintaria a primeira tela escura antes de o React corrigir. A
      `<meta name="theme-color">` precisa sair com a cor do claro. E a pagina
      nao pode depender do que ficou guardado no navegador de quem escolheu
      escuro quando havia escolha.

      Precisa ser embutido e sincrono. Um `<script src>` seria baixado, e a
      pintura aconteceria antes; um `defer` ou `type=module` roda depois do
      HTML, que e tarde demais. Sao as unicas linhas de JavaScript solto da
      aplicacao, e e por um motivo que nao tem contorno.

      O teste `theme.spec.ts` le este arquivo e compara com as constantes de
      la, para que as duas copias nao se separem.
    -->
    <script>
      (function () {
        document.documentElement.setAttribute('data-theme', 'light');

        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0e0e0e');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
