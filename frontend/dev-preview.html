<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E0E0E" />
    <meta
      name="description"
      content="Maison Essence — perfumes e velas aromaticas selecionados."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- As duas familias do design system. `preconnect` antes do stylesheet
         porque a fonte vem de outro dominio: sem ele, o navegador so abre a
         conexao depois de ler o <link>, e o titulo pisca na fonte do sistema. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Jost:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>Maison Essence</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/dev-preview.tsx"></script>
  </body>
</html>
