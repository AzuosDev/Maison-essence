<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E0E0E" />
    <meta
      name="description"
      content="Maison Essence — perfumes e velas aromaticas selecionados."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- As fontes vem do proprio bundle, como em producao: `main.tsx` importa
         os arquivos do @fontsource. Nao ha <link> para o Google aqui de
         proposito — uma bancada que baixa fonte de outro dominio mede uma
         pagina que a loja nao publica. -->

    <!-- O mesmo arranque de tema do `index.html`. Sem ele a bancada so
         obedece ao `prefers-color-scheme` do sistema, e a captura sai no tema
         da maquina de quem rodou em vez do tema que se quis revisar. -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('maison.theme');

          if (mode !== 'light' && mode !== 'dark') {
            mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }

          document.documentElement.setAttribute('data-theme', mode);
        } catch (error) {
          /* Armazenamento bloqueado: fica o tema do sistema, pela @media. */
        }
      })();
    </script>

    <title>Maison Essence</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/dev-preview.tsx"></script>
  </body>
</html>
